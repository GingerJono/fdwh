trigger:
- master  

pool:
  name: duwpmdev01  # Azure DevOps agent pool

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/published'
  targetPath: 'C:\inetpub\wwwroot\Sandbox2'
  iisAppPool: 'Sandbox2AppPool'

stages:
- stage: BuildAndPublish
  displayName: 'Build and Publish Blazor App'
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.408'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: 'Sandbox.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration)'
        projects: 'Sandbox.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Project'
      inputs:
        command: 'publish'
        projects: 'Sandbox.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(publishDir)'
        publishWebProjects: false
        zipAfterPublish: false

    - task: PowerShell@2
      displayName: 'Patch web.config to point to correct DLL safely'
      inputs:
        targetType: 'inline'
        script: |
          $webConfigPath = "$(targetPath)\web.config"
          $correctDll = ".\Sandbox.dll"

          if (-Not (Test-Path $webConfigPath)) {
              Write-Error "web.config not found at $webConfigPath"
              exit 1
          }

          [xml]$xml = Get-Content $webConfigPath

          $systemWebServer = $xml.configuration.'system.webServer'
          $aspNetCore = $systemWebServer.aspNetCore

          if (-not $aspNetCore) {
              Write-Warning "aspNetCore element not found — creating it..."
              $aspNetCore = $xml.CreateElement("aspNetCore")
              $aspNetCore.SetAttribute("processPath", "dotnet")
              $aspNetCore.SetAttribute("arguments", $correctDll)
              $aspNetCore.SetAttribute("stdoutLogEnabled", "true")
              $aspNetCore.SetAttribute("stdoutLogFile", ".\logs\stdout")
              $aspNetCore.SetAttribute("hostingModel", "inprocess")
              $systemWebServer.AppendChild($aspNetCore) | Out-Null
          } else {
              $aspNetCore.arguments = $correctDll
              $aspNetCore.stdoutLogEnabled = "true"
              $aspNetCore.stdoutLogFile = ".\logs\stdout"
              $aspNetCore.hostingModel = "inprocess"
          }

          $xml.Save($webConfigPath)
          Write-Host "✅ web.config updated to use $correctDll"


    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        PathtoPublish: '$(publishDir)'
        ArtifactName: 'drop'

- stage: DeployToIIS
  displayName: 'Deploy to IIS Server'
  dependsOn: BuildAndPublish
  jobs:
  - job: Deploy
    steps:
    - download: current
      artifact: drop

    - task: PowerShell@2
      displayName: 'Stop IIS App Pool if running'
      inputs:
        targetType: 'inline'
        script: |
          Import-Module WebAdministration
          $poolName = "$(iisAppPool)"
          $appPool = Get-Item "IIS:\AppPools\$poolName"

          if ($appPool.state -eq "Started") {
              Write-Host "App pool '$poolName' is currently running. Stopping it..."
              Stop-WebAppPool -Name $poolName
          } else {
              Write-Host "App pool '$poolName' is not running. No need to stop."
          }

    - task: PowerShell@2
      displayName: 'Copy Files to IIS Folder with Exit Code Handling'
      inputs:
        targetType: 'inline'
        script: |
          $source = Get-ChildItem "$(Pipeline.Workspace)\drop" -Directory | Select-Object -First 1 | ForEach-Object { $_.FullName }
          $destination = "$(targetPath)"
          
          Write-Host "Deploying from: $source"
          Write-Host "Deploying to:   $destination"

          $rc = robocopy $source $destination /E /PURGE /R:3 /W:5 /NFL /NDL /NJH /NJS /NP
          $exitCode = $LASTEXITCODE

          if ($exitCode -ge 8) {
              Write-Error "Robocopy failed with exit code $exitCode"
              exit $exitCode
          } else {
              Write-Host "Robocopy succeeded with exit code $exitCode"
              exit 0
          }

    - task: PowerShell@2
      displayName: 'Start IIS App Pool'
      inputs:
        targetType: 'inline'
        script: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "$(iisAppPool)"